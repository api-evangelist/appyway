finding: 'AppyWay publishes no OAuth scopes and no permissions reference page, because the API does not
  use OAuth. Its authentication page documents a single API-KEY header and nothing else, and the four
  contracts AppyWay published to its own repository as of 2026-08-24 declare only the apiKey scheme —
  the oAuth2 blocks listed below came from an earlier harvest and are no longer present upstream. Authorisation
  is instead granted per UK local authority against the key itself: an entitled key succeeds, an unentitled
  one gets 403 naming the authority. That entitlement set is not published or introspectable, so an agent
  cannot discover what its own key may reach without trying.'
platform_oauth: auth.appyway.com is a live Auth0 tenant whose discovery document advertises the standard
  OIDC scopes — openid, profile, offline_access, email, phone, address and the associated claims. Those
  are the web-application login scopes, not API authorisation scopes, and are recorded in well-known/appyway-auth-openid-configuration.json
  rather than here.
