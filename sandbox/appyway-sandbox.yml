summary: >-
  AppyWay documents no sandbox, no test mode and no test key. It does, however, publish
  its documentation through Stoplight, and Stoplight serves a live Prism mock of each of
  the four contracts at a stable public URL. Those mocks answer any caller who sends an
  API-KEY header with any value, which makes a partner-gated API explorable before a key
  is issued. This is a Stoplight-provided surface AppyWay left enabled, not a sandbox
  AppyWay designed — recorded honestly as such.
provider_published_sandbox: false
