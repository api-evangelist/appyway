method: probed
source: live HTTPS probes of every host in apis.yml, every OpenAPI servers[] host, the
  docs/console host, and the embeddable-application hosts named in the AppyWay docs
note: >-
  Only auth.appyway.com serves any /.well-known/ document. It is an Auth0 tenant and it
  answers both /.well-known/openid-configuration and /.well-known/oauth-authorization-server
  with the same 2,479-byte OIDC discovery document (issuer https://auth.appyway.com/).
  That tenant is the AppyWay product login, not the API-key surface the REST APIs use.
  hub.appyway.com, streets.appyway.com and consultation.appyway.com are single-page
  applications whose catch-all route answers 200 with an HTML shell for /.well-known/api-catalog
  and /mcp; those are recorded as misses, not documents. No security.txt, no api-catalog,
  no ai-plugin.json and no agent card is served anywhere on appyway.com.
