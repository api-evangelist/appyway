status_page:
  published: false
  detail: >-
    No status page. status.appyway.com does not resolve (NXDOMAIN). appyway.statuspage.io
    and appyway.instatus.com both answer 200 but serve the vendors' own marketing pages,
    not an AppyWay status page — wildcard soft-200s, recorded as misses. Each API does
    expose a GET /ping liveness route, but it requires a valid API-KEY, so it is not a
    public status signal.
  probes:
  - url: https://status.appyway.com
    status: 000
    note: DNS does not resolve
  - url: https://appyway.statuspage.io
    status: 200
    note: Atlassian Statuspage marketing page, not an AppyWay status page
  - url: https://appyway.instatus.com
    status: 200
    note: Instatus marketing page, not an AppyWay status page
support:
