description: 'AppyWay publishes no plans, no price list and no self-serve signup for its APIs. Re-checked
  on 2026-09-04: there is no /pricing page on appyway.com (404), no plans or tiers anywhere in the developer
  documentation, and no machine-readable catalogue endpoint. API keys are issued only by emailing apisupport@appyway.com,
  so commercial terms and quotas are set per contract. plan_count is an honest zero.'
notes: Every documented path to access — obtaining a key, raising a rate limit, resolving a problem —
  routes through apisupport@appyway.com. The docs portal itself is fully public and unauthenticated; it
  is the commercial surface, not the documentation, that is gated.
