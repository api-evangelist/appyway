  method: GET
  status: 200
  note: >-
    NOT an MCP server. The Explorer single-page application answers its catch-all route
    with a text/html shell for any unknown path. streets.appyway.com/mcp and
    consultation.appyway.com/mcp behave identically. Recorded as misses.
candidate_tools:
