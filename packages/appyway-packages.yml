sdk_finding: >-
  AppyWay publishes NO client SDK for the AppyWay REST API in any language. The 14
  first-party packages below are all open-source .NET infrastructure libraries the
  company factored out of its own platform — GeoJSON serialisation, a Flurl HTTP
  wrapper, configuration providers, a git-backed datastore. Not one of them wraps
  api.appyway.com, and none is presented in the developer docs as an integration path.
  Ownership is verified from the NuGet catalogEntry: every projectUrl resolves to
  github.com/YellowLineParking, AppyWay's own GitHub organisation (already recorded as
  the GitHubOrganization pointer in apis.yml). No SDKs pointer is emitted on this
  record, because sdk_count for the AppyWay API is honestly zero.
decay_signal: >-
  The spatial and HTTP libraries closest to the API surface have not shipped since
  2022-2024, while the API contract itself was last republished 2026-08-24. Only the
  Appy.Configuration family (2026-02-24) is still under active release.
