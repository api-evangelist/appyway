finding: >-
  AppyWay publishes no human-readable changelog or release-notes page anywhere on
  appyway.com or docs.appyway.com. What it does publish is better in one respect and worse
  in another: every platform deployment pushes the regenerated OpenAPI, YAML and Postman
  artefacts to a public GitHub repository, tagged "Deployment 'Deployments-NNNNN'". That
  gives a precisely dated, diffable record of contract change — but the messages carry no
  description, so what changed can only be recovered by diffing the specs, and a breaking
  removal looks identical to an additive one.
breaking_change_notice: none
entries_note: >-
  Dates below are the dates the contract files themselves changed, not every repository
  push. Additions and removals are not stated because the provider does not state them;
  the two changes we could establish by diff are recorded in
  lifecycle/appyway-lifecycle.yml under observed_removals.
