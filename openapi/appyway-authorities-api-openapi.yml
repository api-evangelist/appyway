          description: Determines who this rule applies to. See the reference API for more information
        maxStay:
          type:
          - integer
          - 'null'
          description: Maximum stay duration in minutes.
          format: int32
        minStay:
          type:
          - integer
          - 'null'
          description: Minimum stay duration in minutes.
          format: int32
        noReturn:
          type:
          - integer
          - 'null'
          description: No return duration in minutes.
          format: int32
        noReturnUntil:
          type:
          - string
          - 'null'
          description: No return duration in minutes.
          example: 00:00:00
      additionalProperties: false
    TariffForTimesAndDatesCms:
      type: object
      properties:
        setName:
          type:
          - string
          - 'null'
          description: The name of the tariff set to which this tariff belongs.
        parkingEntitlementTypeIds:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
          description: The payment types for which these tariff details apply.
        details:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TariffDetailCms'
          description: 'The details of the tariff that applies for the entitlement types

            and dates indicated by this entry.'
        timeFrom:
          type:
          - string
          - 'null'
          description: 'For tariffs that vary by time of day, this indicates the

            (inclusive) start time from which these particular tariff details

            apply.'
          example: 00:00:00
        timeTo:
          type:
          - string
          - 'null'
          description: 'For tariffs that vary by time of day, this indicates the

            (exclusive) end time to which these particular tariff details

            apply.'
          example: 00:00:00
        firstDate:
          $ref: '#/components/schemas/MonthAndDayCms'
        lastDate:
          $ref: '#/components/schemas/MonthAndDayCms'
        months:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
          description: The months of the year on which these details apply.
        days:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
          description: 'The days of the week (1 = Mon, 7 = Sun) on which these details

            apply.'
        timeType:
          type:
          - integer
          - 'null'
          description: Indicates the Type of Tariff
          format: int32
      additionalProperties: false
      description: 'Contains tariff details applicable to a particular set of dates and

        times, and for a particular set of entitlement types.'
    CapabilitiesState:
