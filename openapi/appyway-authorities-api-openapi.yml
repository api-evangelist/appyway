                    isOffStreetPubliclyViewable: true
                    acceptChargePointRequests: true
                    hideTariffsOnMapSchedules: true
                    hideTariffsOnStreets: true
                    hideRestrictedSpeedLimitsOnStreets: true
                  highwayAuthority: string
